name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore HL7Workbench.sln --locked-mode
      - run: dotnet build HL7Workbench.sln --configuration Release --no-restore
      - run: dotnet test HL7Workbench.sln --configuration Release --no-build --no-restore
      - run: python -B -m unittest build/test_documentation_catalog.py
      - run: python build/WriteDocumentationCatalog.py --check
      - run: python build/WriteScriptApiReference.py --check
      # Synthetic fixture trees/archives and temporary compiler checkouts only.
      # This does not publish, stage, upload or distribute application binaries.
      - run: python -B -m unittest discover -s build -p 'test_portable*.py'
      - run: python -B -m unittest discover -s build -p 'test_release_compilation.py'
